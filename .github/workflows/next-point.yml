# SPDX-License-Identifier: GPL-3.0-or-later
name: next-point

# GNOME's next point release from Fedora 45's updates-testing, before the GA push makes it stable. Report-only:
# never on a pull request, never required, and lane.sh runs without APEX_LANE_CACHE, so no lane cache is read or written.
on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 3 * * 2'

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  lane:
    name: tests/lib/lane.sh gnome-shell (Fedora 45 with updates-testing)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      shell: ${{ steps.lane.outputs.shell }}
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout and the Source1 archive
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed grep tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: apex-image admitting updates-testing, and what moves
        run: |
          .github/scripts/next-point.sh image "$PWD/_build/next-point/apex-image"
          .github/scripts/next-point.sh versions | tee -a "$GITHUB_STEP_SUMMARY"

      - name: tests/lib/lane.sh gnome-shell
        id: lane
        run: |
          APEX_IMAGE_SRC="$PWD/_build/next-point/apex-image" tests/lib/lane.sh gnome-shell
          echo "shell=$(rpm -qp --qf '%{name}-%{version}-%{release}' _build/gnome-shell/out/gnome-shell-[0-9]*.x86_64.rpm)" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-point-gnome-shell-rpms
          path: |
            _build/gnome-shell/out/gnome-shell-[0-9]*.x86_64.rpm
            _build/gnome-shell/out/gnome-shell-common-[0-9]*.noarch.rpm
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: next-point-lane
          path: _build/gnome-shell/out/
          if-no-files-found: ignore

  g2:
    name: tests/shots/patched.sh (Fedora 45 with updates-testing, every case)
    needs: [lane]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      g2: ${{ steps.counts.outputs.g2 }}
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed grep tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-point-gnome-shell-rpms
          path: _build/next-point/rpms

      - name: dnf5 sees updates-testing
        run: .github/scripts/next-point.sh shim

      - name: tests/shots/patched.sh on the lane's RPMs
        run: |
          mkdir -p _build/next-point/g2
          PATCHED_RPMS="$PWD/_build/next-point/rpms" PATCHED_OUT="$PWD/_build/next-point/g2" tests/shots/patched.sh 2>&1 |
            tee _build/next-point/g2.log

      - name: G2's counts
        id: counts
        if: ${{ !cancelled() }}
        run: echo "g2=$(.github/scripts/next-point.sh counts g2 _build/next-point/g2.log)" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: next-point-g2
          path: _build/next-point/g2/
          if-no-files-found: ignore
          retention-days: 7

  signoff:
    name: tests/shots/signoff.sh --goldens (Fedora 45 with updates-testing, the shell boards)
    needs: [lane]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      goldens: ${{ steps.counts.outputs.goldens }}
      shoot: ${{ steps.counts.outputs.shoot }}
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed grep tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-point-gnome-shell-rpms
          path: _build/next-point/rpms

      - name: dnf5 sees updates-testing
        run: .github/scripts/next-point.sh shim

      - name: tests/shell/shoot.sh's packages
        run: >-
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          mesa-dri-drivers dbus-daemon python3-dbusmock python3-gobject gcc accountsservice polkit librsvg2-tools
          openssl git-core adwaita-sans-fonts jetbrains-mono-fonts-all procps-ng jq

      - name: tests/shots/signoff.sh --goldens
        run: |
          mkdir -p _build/next-point
          tests/shots/signoff.sh --goldens _build/next-point/rpms _build/signoff 2>&1 | tee _build/next-point/signoff.log

      - name: the goldens' and shoot.sh's counts
        id: counts
        if: ${{ !cancelled() }}
        run: |
          echo "goldens=$(.github/scripts/next-point.sh counts goldens _build/next-point/signoff.log)" >>"$GITHUB_OUTPUT"
          echo "shoot=$(.github/scripts/next-point.sh counts shoot _build/next-point/signoff.log)" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: next-point-signoff
          path: |
            _build/signoff/
            _build/signoff-work/g2/run/
            _build/gnome-shell/shots/
          if-no-files-found: ignore
          retention-days: 7

  apps:
    name: ${{ matrix.shoot }} (Fedora 45 with updates-testing, the ${{ matrix.app }} boards)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: control-center
            key: cc
            pkg: gnome-control-center
            shoot: tests/control-center/run.sh
            packages: >-
              gnome-shell mesa-dri-drivers dbus-daemon python3-dbusmock python3-gobject at-spi2-core gcc util-linux
              adwaita-sans-fonts python3-dbus systemd gnome-backgrounds umockdev
          - app: nautilus
            key: files
            pkg: nautilus
            shoot: tests/nautilus/shoot.sh
            packages: >-
              gnome-shell mesa-dri-drivers dbus-daemon python3-dbusmock gcc util-linux at-spi2-core python3-gobject
              inkscape glycin-thumbnailer adwaita-sans-fonts jetbrains-mono-fonts-all
    steps:
      - name: git for the checkout and the Source1 archive
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed grep tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: apex-image admitting updates-testing
        run: .github/scripts/next-point.sh image "$PWD/_build/next-point/apex-image"

      - name: tests/lib/lane.sh libadwaita and ${{ matrix.pkg }}
        env:
          PKG: ${{ matrix.pkg }}
        run: |
          APEX_IMAGE_SRC="$PWD/_build/next-point/apex-image" tests/lib/lane.sh libadwaita
          APEX_IMAGE_SRC="$PWD/_build/next-point/apex-image" tests/lib/lane.sh "$PKG"

      - name: dnf5 sees updates-testing
        run: .github/scripts/next-point.sh shim

      - name: the shooter's packages, then the lane's libadwaita over Fedora's
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          read -ra packages <<<"$PACKAGES"
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install "${packages[@]}"
          if rpm -q libadwaita-devel >/dev/null; then
              dnf5 -y -q --setopt=clean_requirements_on_remove=False remove libadwaita-devel
          fi
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install _build/libadwaita/out/libadwaita-[0-9]*.x86_64.rpm
          rpm -q libadwaita | grep -q '\.apex'

      - name: apex-desktop at tests/lib/pins.sh's APEX_DESKTOP_REV
        if: matrix.app == 'nautilus'
        run: |
          . tests/lib/pins.sh
          git init -q _build/apex-desktop
          git -C _build/apex-desktop fetch -q --depth 1 "$APEX_DESKTOP_URL" "$APEX_DESKTOP_REV"
          git -C _build/apex-desktop checkout -q --detach FETCH_HEAD
          echo "APEX_DESKTOP_SRC=$PWD/_build/apex-desktop" >>"$GITHUB_ENV"

      - name: ${{ matrix.shoot }} on the lane's RPMs
        env:
          SHOOT: ${{ matrix.shoot }}
          PKG: ${{ matrix.pkg }}
        run: |
          mkdir -p _build/next-point
          "$SHOOT" "_build/$PKG/out" 2>&1 | tee "_build/next-point/$PKG.log"

      - name: the app's counts
        if: ${{ !cancelled() }}
        env:
          KEY: ${{ matrix.key }}
          PKG: ${{ matrix.pkg }}
        run: |
          mkdir -p _build/next-point/counts
          echo "$(rpm -qp --qf '%{name}-%{version}-%{release}' "_build/$PKG/out/$PKG"-[0-9]*.x86_64.rpm 2>/dev/null || echo "$PKG ?")" \
            "$(.github/scripts/next-point.sh counts tap "_build/next-point/$PKG.log")" >"_build/next-point/counts/$KEY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: next-point-count-${{ matrix.key }}
          path: _build/next-point/counts/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: next-point-${{ matrix.app }}
          path: |
            _build/next-point/${{ matrix.pkg }}.log
            _build/${{ matrix.app }}/shots/
          if-no-files-found: ignore
          retention-days: 7

  libadwaita:
    name: tests/libadwaita/radius-test.sh (Fedora 45 with updates-testing, --stock, rewrite, --late)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed grep tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: apex-image admitting updates-testing
        run: .github/scripts/next-point.sh image "$PWD/_build/next-point/apex-image"

      - name: tests/lib/lane.sh libadwaita
        run: APEX_IMAGE_SRC="$PWD/_build/next-point/apex-image" tests/lib/lane.sh libadwaita

      - name: dnf5 sees updates-testing
        run: .github/scripts/next-point.sh shim

      - name: tests/libadwaita/radius-test.sh, the three modes
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install \
            ptyxis gnome-shell mesa-dri-drivers dbus-daemon python3-dbusmock gcc util-linux jq
          mkdir -p _build/next-point/counts
          ok=0 bad=0
          for mode in --stock _build/libadwaita/out "--late _build/libadwaita/out"; do
              # shellcheck disable=SC2086 # --late and its RPM directory are two words
              if tests/libadwaita/radius-test.sh $mode; then ok=$((ok + 1)); else bad=$((bad + 1)); fi
          done
          echo "$(rpm -qp --qf '%{name}-%{version}-%{release}' _build/libadwaita/out/libadwaita-[0-9]*.x86_64.rpm) $ok/$bad" \
            >_build/next-point/counts/libadwaita
          ((bad == 0))

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: next-point-count-libadwaita
          path: _build/next-point/counts/
          if-no-files-found: ignore
          retention-days: 7

  ptyxis:
    name: tests/ptyxis (Fedora 45 with updates-testing, status, shoot, contrast, palette, panes)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed grep tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: apex-image admitting updates-testing
        run: .github/scripts/next-point.sh image "$PWD/_build/next-point/apex-image"

      - name: tests/lib/lane.sh ptyxis
        run: APEX_IMAGE_SRC="$PWD/_build/next-point/apex-image" tests/lib/lane.sh ptyxis

      - name: dnf5 sees updates-testing
        run: .github/scripts/next-point.sh shim

      - name: tests/ptyxis, as ci.yml runs them
        env:
          APEX_PTYXIS_TESTS_NO_SKIP: "1"
          APEX_PTYXIS_TARGETS: "1"
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install \
            glib2-devel pkgconf-pkg-config gnome-shell mesa-dri-drivers dbus-daemon python3-dbusmock gcc util-linux jq \
            jetbrains-mono-fonts-all adwaita-sans-fonts python3-gobject at-spi2-core procps-ng
          mkdir -p _build/next-point/counts
          ok=0 bad=0
          run() { if "$@"; then ok=$((ok + 1)); else bad=$((bad + 1)); fi; }
          run tests/ptyxis/status-test.sh
          run tests/ptyxis/shoot.sh _build/ptyxis/out
          run tests/ptyxis/contrast-test.sh
          tests/s2c/agent.sh
          run tests/ptyxis/palette-test.sh _build/ptyxis/out _build/s2c/apex-session-agent
          run tests/ptyxis/panes-test.sh _build/ptyxis/out
          echo "$(rpm -qp --qf '%{name}-%{version}-%{release}' _build/ptyxis/out/ptyxis-[0-9]*.x86_64.rpm) $ok/$bad" \
            >_build/next-point/counts/ptyxis
          ((bad == 0))

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: next-point-count-ptyxis
          path: _build/next-point/counts/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: next-point's one-line result
    needs: [lane, g2, signoff, apps, libadwaita, ptyxis]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: next-point-count-*
          path: counts
          merge-multiple: true

      - name: the line, passed/failed for each, ? where a job gave none
        env:
          SHELL_NEVR: ${{ needs.lane.outputs.shell || '?' }}
          G2: ${{ needs.g2.outputs.g2 || '?' }}
          GOLDENS: ${{ needs.signoff.outputs.goldens || '?' }}
          SHOOT: ${{ needs.signoff.outputs.shoot || '?' }}
        run: |
          app() { [[ -s counts/$1 ]] && cat "counts/$1" || echo "$1 ?"; }
          line="next-point: $SHELL_NEVR g2 $G2 goldens $GOLDENS shoot $SHOOT | $(app cc) | $(app files)"
          line+=" | $(app libadwaita) | $(app ptyxis)"
          echo "$line"
          printf '%s\n' "\`$line\`" >>"$GITHUB_STEP_SUMMARY"
