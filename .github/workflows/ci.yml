# SPDX-License-Identifier: GPL-3.0-or-later
name: ci

# No path filter: biometric data can arrive in any directory (the privacy job).
on:
  pull_request: {}
  push:
    branches: [main]
  # Weekly, every lane rebuilt without the lane cache: reuse skips buildroot drift, this catches it.
  # Daily, with the cache, so G2's full set runs at least once a day (pull requests run its pr part).
  schedule:
    - cron: '17 4 * * 1'
    - cron: '43 3 * * *'

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  layer-tests:
    name: tests/layer/run.sh (Fedora 45)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
      # Mount namespaces for bubblewrap's /proc/cmdline fixture; the runner is disposable and this job holds no secrets.
      options: --privileged
    env:
      APEX_LAYER_TESTS_NO_SKIP: "1"
    steps:
      - name: gjs, glib2, gi-compile-repository for the fixture typelibs, bubblewrap, and dbus-daemon for each case's session bus
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          gjs glib2 /usr/bin/gi-compile-repository bubblewrap dbus-daemon bash coreutils gawk grep sed

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tests/layer/run.sh
        run: tests/layer/run.sh

  shots-tests:
    # G2 itself needs the built image and runs in apex-image's builder VM; this job tests
    # its PNG comparison, its assertions and its dbusmock fixtures.
    name: tests/shots/selftest.sh (Fedora 45)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    env:
      APEX_SHOTS_TESTS_NO_SKIP: "1"
    steps:
      - name: gjs, GdkPixbuf, jq, the fixtures' dbus-daemon, python3-dbusmock and client libraries, frame.c's glib2-devel, and goldens.sh's git
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          gjs gdk-pixbuf2 jq bash coreutils gawk grep sed
          dbus-daemon python3-dbusmock NetworkManager-libnm gnome-bluetooth-libs gcc glib2-devel git-core

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tests/shots/selftest.sh
        run: tests/shots/selftest.sh

  shots-smoke:
    # G2's harness on Fedora's own gnome-shell: a change that keeps the shell from starting
    # or reporting fails here, before a builder-VM run.
    name: tests/shots/smoke.sh (Fedora 45, Fedora's gnome-shell)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: Fedora's gnome-shell, the fixtures' services, gcc and glib2-devel for clock.c and frame.c, gjs and jq
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          gnome-shell mesa-dri-drivers dbus-daemon python3-dbusmock gcc glib2-devel gjs jq bash coreutils gawk grep sed malcontent-libs

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tests/shots/smoke.sh
        run: tests/shots/smoke.sh

  eslint:
    name: lint/eslint.sh (Fedora 45)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    env:
      APEX_LINT_NO_SKIP: "1"
    steps:
      - name: nodejs, npm and git for lint/package-lock.json
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          nodejs npm git-core bash coreutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: lint/eslint.sh
        run: lint/eslint.sh

  theme:
    name: lint/theme.sh (Fedora 45)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    env:
      APEX_LINT_NO_SKIP: "1"
    steps:
      - name: sassc, git, and dnf5 download with rpm2cpio for gnome-shell's SRPM
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          sassc git-core dnf5-plugins rpm cpio tar xz bash coreutils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: lint/theme.sh
        run: lint/theme.sh

  ptyxis-lane:
    # The ptyxis recipe through apex-lane's own container half, built from a pinned
    # apex-image; the builder VM adds only the signing and the store.
    name: tests/lib/lane.sh ptyxis (Fedora 45, Ptyxis rebuilt)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout and the Source1 archive
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tests/ptyxis/selftest.sh
        run: tests/ptyxis/selftest.sh

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event.schedule != '17 4 * * 1'
        with:
          path: _build/lane-cache
          key: lane-ptyxis-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lane-ptyxis-

      - name: tests/lib/lane.sh ptyxis
        id: lane
        env:
          APEX_LANE_CACHE: ${{ github.event.schedule != '17 4 * * 1' && '_build/lane-cache' || '' }}
        run: tests/lib/lane.sh ptyxis

      # Only a build changes the cache; a reused key leaves it as it was.
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: steps.lane.outputs.built == 'true'
        with:
          path: _build/lane-cache
          key: lane-ptyxis-${{ github.run_id }}-${{ github.run_attempt }}

      - name: tests/ptyxis/status-test.sh
        env:
          APEX_PTYXIS_TESTS_NO_SKIP: "1"
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install glib2-devel pkgconf-pkg-config
          tests/ptyxis/status-test.sh

      - name: tests/ptyxis/shoot.sh on the built RPM
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install \
            gnome-shell mesa-dri-drivers dbus-daemon python3-dbusmock gcc util-linux jq jetbrains-mono-fonts-all adwaita-sans-fonts
          tests/ptyxis/shoot.sh _build/ptyxis/out

      - name: tests/s2c/agent.sh
        run: tests/s2c/agent.sh

      - name: tests/ptyxis/palette-test.sh on the built RPM
        run: tests/ptyxis/palette-test.sh _build/ptyxis/out _build/s2c/apex-session-agent

      - name: tests/ptyxis/panes-test.sh on the built RPM
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install python3-gobject at-spi2-core procps-ng
          tests/ptyxis/panes-test.sh _build/ptyxis/out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ptyxis-shots
          path: _build/ptyxis/shots/
          if-no-files-found: ignore

  libadwaita-lane:
    # The libadwaita recipe through apex-lane's own container half, then its radius test
    # on Fedora's libadwaita and on the built one.
    name: tests/lib/lane.sh libadwaita (Fedora 45, libadwaita rebuilt)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event.schedule != '17 4 * * 1'
        with:
          path: _build/lane-cache
          key: lane-libadwaita-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lane-libadwaita-

      - name: tests/lib/lane.sh libadwaita
        id: lane
        env:
          APEX_LANE_CACHE: ${{ github.event.schedule != '17 4 * * 1' && '_build/lane-cache' || '' }}
        run: tests/lib/lane.sh libadwaita

      # Only a build changes the cache; a reused key leaves it as it was.
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: steps.lane.outputs.built == 'true'
        with:
          path: _build/lane-cache
          key: lane-libadwaita-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libadwaita-rpms
          path: |
            _build/libadwaita/out/libadwaita-[0-9]*.x86_64.rpm
          if-no-files-found: error
          retention-days: 3

      - name: tests/libadwaita/radius-test.sh on Fedora's libadwaita
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install \
            ptyxis gnome-shell mesa-dri-drivers dbus-daemon python3-dbusmock gcc util-linux jq
          tests/libadwaita/radius-test.sh --stock

      - name: tests/libadwaita/radius-test.sh on the built RPM
        run: tests/libadwaita/radius-test.sh _build/libadwaita/out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: libadwaita-lane
          path: |
            _build/libadwaita/out/
            _build/libadwaita/radius/
          if-no-files-found: ignore

  control-center-lane:
    # The gnome-control-center recipe through apex-lane's own container half, built from
    # a pinned apex-image; the builder VM adds only the signing and the store.
    name: tests/lib/lane.sh gnome-control-center (Fedora 45, gnome-control-center rebuilt)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout and the Source1 archive
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed grep tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tests/control-center/selftest.sh
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install python3
          tests/control-center/selftest.sh

      - name: tests/control-center/state-test.sh
        env:
          APEX_CONTROL_CENTER_TESTS_NO_SKIP: "1"
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install gcc glib2-devel pkgconf-pkg-config
          tests/control-center/state-test.sh

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event.schedule != '17 4 * * 1'
        with:
          path: _build/lane-cache
          key: lane-gnome-control-center-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lane-gnome-control-center-

      - name: tests/lib/lane.sh gnome-control-center
        id: lane
        env:
          APEX_LANE_CACHE: ${{ github.event.schedule != '17 4 * * 1' && '_build/lane-cache' || '' }}
        run: tests/lib/lane.sh gnome-control-center

      # Only a build changes the cache; a reused key leaves it as it was.
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: steps.lane.outputs.built == 'true'
        with:
          path: _build/lane-cache
          key: lane-gnome-control-center-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnome-control-center-rpms
          path: |
            _build/gnome-control-center/out/gnome-control-center-[0-9]*.x86_64.rpm
            _build/gnome-control-center/out/gnome-control-center-filesystem-[0-9]*.noarch.rpm
          if-no-files-found: error
          retention-days: 3

      - name: tests/control-center/run.sh on the built RPMs
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install \
            gnome-shell mesa-dri-drivers dbus-daemon python3-dbusmock python3-gobject at-spi2-core gcc util-linux adwaita-sans-fonts python3-dbus systemd gnome-backgrounds umockdev
          tests/control-center/run.sh _build/gnome-control-center/out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: control-center-shots
          path: _build/control-center/shots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: control-center-lane
          path: _build/gnome-control-center/out/
          if-no-files-found: ignore

  nautilus-lane:
    # The nautilus recipe through apex-lane's own container half, built from a pinned
    # apex-image; the builder VM adds only the signing and the store.
    name: tests/lib/lane.sh nautilus (Fedora 45, nautilus rebuilt)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout and the Source1 archive
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed grep tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tests/nautilus/selftest.sh
        run: tests/nautilus/selftest.sh

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event.schedule != '17 4 * * 1'
        with:
          path: _build/lane-cache
          key: lane-nautilus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lane-nautilus-

      - name: tests/lib/lane.sh nautilus
        id: lane
        env:
          APEX_LANE_CACHE: ${{ github.event.schedule != '17 4 * * 1' && '_build/lane-cache' || '' }}
        run: tests/lib/lane.sh nautilus

      # Only a build changes the cache; a reused key leaves it as it was.
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: steps.lane.outputs.built == 'true'
        with:
          path: _build/lane-cache
          key: lane-nautilus-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nautilus-rpms
          path: |
            _build/nautilus/out/nautilus-[0-9]*.x86_64.rpm
            _build/nautilus/out/nautilus-extensions-[0-9]*.x86_64.rpm
          if-no-files-found: error
          retention-days: 3

      - name: tests/nautilus/format-test.sh
        env:
          APEX_NAUTILUS_TESTS_NO_SKIP: "1"
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install gcc glib2-devel pkgconf-pkg-config
          tests/nautilus/format-test.sh

      - name: tests/nautilus/shoot.sh on the built RPMs
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install \
            gnome-shell mesa-dri-drivers dbus-daemon python3-dbusmock gcc util-linux at-spi2-core python3-gobject \
            inkscape glycin-thumbnailer adwaita-sans-fonts jetbrains-mono-fonts-all
          tests/nautilus/shoot.sh _build/nautilus/out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nautilus-shots
          path: _build/nautilus/shots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: nautilus-lane
          path: _build/nautilus/out/
          if-no-files-found: ignore

  shell-lane:
    # The gnome-shell recipe through apex-lane's container half, then the lock screen and
    # the greeter of that build against a GDM mock that never lets a verification succeed.
    name: tests/lib/lane.sh gnome-shell (Fedora 45, lock screen and greeter)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout and the Source1 archive
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed grep tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event.schedule != '17 4 * * 1'
        with:
          path: _build/lane-cache
          key: lane-gnome-shell-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lane-gnome-shell-

      - name: tests/lib/lane.sh gnome-shell
        id: lane
        env:
          APEX_LANE_CACHE: ${{ github.event.schedule != '17 4 * * 1' && '_build/lane-cache' || '' }}
        run: tests/lib/lane.sh gnome-shell

      # Only a build changes the cache; a reused key leaves it as it was.
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: steps.lane.outputs.built == 'true'
        with:
          path: _build/lane-cache
          key: lane-gnome-shell-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gnome-shell-rpms
          path: |
            _build/gnome-shell/out/gnome-shell-[0-9]*.x86_64.rpm
            _build/gnome-shell/out/gnome-shell-common-[0-9]*.noarch.rpm
          if-no-files-found: error
          retention-days: 3

      - name: tests/shell/shoot.sh on the built RPMs
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install \
            mesa-dri-drivers dbus-daemon python3-dbusmock python3-gobject gcc accountsservice polkit librsvg2-tools openssl git-core adwaita-sans-fonts jetbrains-mono-fonts-all
          tests/shell/shoot.sh _build/gnome-shell/out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: shell-shots
          path: _build/gnome-shell/shots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: shell-lane
          path: _build/gnome-shell/out/
          if-no-files-found: ignore

  shots-patched:
    # G2 on the patched shell, the lane's RPMs from its artifact: direct.sh's cases and
    # their assertions, which no other job runs before a builder VM.
    name: tests/shots/patched.sh (Fedora 45, the lane's gnome-shell)
    needs: [shell-lane]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed grep tar

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gnome-shell-rpms
          path: _build/shots-patched/rpms

      - name: tests/shots/patched.sh on the lane's RPMs, direct.sh pr on a pull request and main otherwise
        env:
          PATCHED_PART: ${{ github.event_name == 'pull_request' && 'pr' || '' }}
        run: PATCHED_RPMS="$PWD/_build/shots-patched/rpms" PATCHED_OUT="$PWD/_build/shots-patched/out" tests/shots/patched.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: shots-patched
          path: _build/shots-patched/out/
          if-no-files-found: ignore

  s2c-radius:
    # S2c's live window radius end to end: the lanes' libadwaita, Settings and Files (from their
    # caches by content key, so only libadwaita gates it) with apex-system's agent, in one shell.
    name: tests/s2c/radius-test.sh (Fedora 45, S2c live radius)
    needs: [libadwaita-lane]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout and apex-system
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed grep tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tests/s2c/agent.sh
        run: tests/s2c/agent.sh

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libadwaita-rpms
          path: _build/s2c/rpms

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event.schedule != '17 4 * * 1'
        with:
          path: _build/lane-cache
          key: lane-gnome-control-center-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lane-gnome-control-center-

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event.schedule != '17 4 * * 1'
        with:
          path: _build/lane-cache
          key: lane-nautilus-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lane-nautilus-

      - name: tests/lib/lane.sh gnome-control-center and nautilus, reused by key or built
        env:
          APEX_LANE_CACHE: ${{ github.event.schedule != '17 4 * * 1' && '_build/lane-cache' || '' }}
        run: |
          tests/lib/lane.sh gnome-control-center
          tests/lib/lane.sh nautilus
          cp -- _build/gnome-control-center/out/gnome-control-center-[0-9]*.x86_64.rpm \
            _build/gnome-control-center/out/gnome-control-center-filesystem-[0-9]*.noarch.rpm \
            _build/nautilus/out/nautilus-[0-9]*.x86_64.rpm \
            _build/nautilus/out/nautilus-extensions-[0-9]*.x86_64.rpm _build/s2c/rpms/

      - name: tests/s2c/radius-test.sh on the lanes' RPMs
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install \
            ptyxis gnome-shell mesa-dri-drivers dbus-daemon dconf python3-dbusmock python3-gobject at-spi2-core \
            gcc util-linux jq adwaita-sans-fonts
          tests/s2c/radius-test.sh _build/s2c/rpms _build/s2c/apex-session-agent

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: s2c-radius
          path: _build/s2c/radius/
          if-no-files-found: ignore

  s7-accent:
    # S7's accent exit end to end: the gnome-shell lane's build (from its cache by content key)
    # with apex-system's agent and apex-desktop's folder themes, Files, GTK's chooser and Spotlight.
    name: tests/s7/accent-test.sh (Fedora 45, S7 accent folders)
    needs: [shell-lane]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout, apex-system and apex-desktop
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed grep tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: tests/s2c/agent.sh
        run: tests/s2c/agent.sh

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: github.event.schedule != '17 4 * * 1'
        with:
          path: _build/lane-cache
          key: lane-gnome-shell-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lane-gnome-shell-

      - name: tests/lib/lane.sh gnome-shell, reused by key or built
        env:
          APEX_LANE_CACHE: ${{ github.event.schedule != '17 4 * * 1' && '_build/lane-cache' || '' }}
        run: tests/lib/lane.sh gnome-shell

      - name: tests/s7/accent-test.sh on the lane's RPMs
        run: |
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install \
            nautilus gjs gtk4 ptyxis mesa-dri-drivers dbus-daemon python3-dbusmock python3-gobject \
            gcc util-linux jq adwaita-sans-fonts
          tests/s7/accent-test.sh _build/gnome-shell/out _build/s2c/apex-session-agent

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: s7-accent
          path: _build/s7/accent/
          if-no-files-found: ignore

  scripts:
    name: shellcheck, actionlint, selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/install-tool@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main
        with:
          tools: actionlint shellcheck

      - name: actionlint
        run: actionlint -config-file .github/scripts/actionlint.yaml

      - name: bash -n and shellcheck
        run: |
          files=(.github/scripts/*.sh lint/*.sh packaging/pkgs/*/*.sh tests/*/*.sh)
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck -x -P .github/scripts --severity=style "${files[@]}"

      - name: Script self-tests
        run: .github/scripts/selftest.sh

      - name: tests/s7/selftest.sh
        run: tests/s7/selftest.sh

      - name: tests/laptop/selftest.sh
        run: tests/laptop/selftest.sh

  privacy:
    name: No biometric files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/privacy-guard@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main

  comments:
    name: Comment guard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: apex-linux/apex-ci/actions/comments@6e5d6c625ccb44ba31d1ca97a2a94a27205940a1 # main
