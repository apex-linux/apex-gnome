name: signoff

# The owner's sign-off captures (tests/shots/signoff.sh), checked against the approved goldens.
# A pull request runs it when it changes what the captures render (signoff-paths.sh) or is labelled goldens.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - desktop/shell/**
      - packaging/pkgs/gnome-shell/**
      - tests/shots/**
      - tests/shell/**
      - tests/lib/**
      - .github/workflows/signoff.yml
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '41 5 * * *'

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  rendered:
    name: Does the pull request change what the captures render?
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      touches: ${{ steps.paths.outputs.touches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: .github/scripts/signoff-paths.sh
        id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only "$BASE...$HEAD" | .github/scripts/signoff-paths.sh >>"$GITHUB_OUTPUT"

  signoff:
    name: tests/shots/signoff.sh (Fedora 45, every shell board, light and dark, against the goldens)
    needs: rendered
    # Another label on a pull request neither starts a run nor, through the job's group, cancels one.
    if: >-
      !cancelled() && needs.rendered.result != 'failure'
      && (github.event_name != 'pull_request'
          || (github.event.action != 'labeled' && needs.rendered.outputs.touches == 'true')
          || (contains(github.event.pull_request.labels.*.name, 'goldens')
              && (github.event.action != 'labeled' || github.event.label.name == 'goldens')))
    concurrency:
      group: signoff-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    container:
      image: registry.fedoraproject.org/fedora:45@sha256:1e13e11f63e147a40a935c9046c79d53a30b861a3cf05ebb023bb53c562382cb
    steps:
      - name: git for the checkout and the Source1 archive
        run: >-
          dnf5 -y --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          git-core bash coreutils findutils sed grep tar zstd

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: _build/lane-cache
          key: lane-gnome-shell-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lane-gnome-shell-

      - name: tests/lib/lane.sh gnome-shell
        env:
          APEX_LANE_CACHE: _build/lane-cache
        run: tests/lib/lane.sh gnome-shell

      - name: tests/shell/shoot.sh's packages
        run: >-
          dnf5 -y -q --setopt=install_weak_deps=False --repo=fedora --repo=updates install
          mesa-dri-drivers dbus-daemon python3-dbusmock python3-gobject gcc accountsservice polkit librsvg2-tools
          openssl git-core adwaita-sans-fonts jetbrains-mono-fonts-all procps-ng jq

      - name: tests/shots/signoff.sh
        id: capture
        run: tests/shots/signoff.sh _build/gnome-shell/out _build/signoff

      - name: tests/shots/goldens.sh check
        run: tests/shots/goldens.sh check _build/signoff

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        with:
          name: signoff-${{ github.sha }}
          path: _build/signoff/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: signoff-logs-${{ github.sha }}
          path: |
            _build/signoff-work/g2/run/
            _build/gnome-shell/shots/
          if-no-files-found: ignore
