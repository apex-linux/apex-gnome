<!-- The Apex diamond: a 10 px square with a 2 px border and radius 2, rotated 45°, drawn on the
     stroke's centre line. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <rect x="4" y="4" width="8" height="8" rx="1" fill="none" stroke="#f6f6f8" stroke-width="2" transform="rotate(45 8 8)"/>
</svg>
